<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bendskin Rush First-Person Motorcycle Logo">
  <defs>
    <!-- Shield & Frame Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <!-- Sunset Sky -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="42%" stop-color="#7c2d12" />
      <stop offset="78%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="44%" r="32%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <!-- Road Asphalt -->
    <linearGradient id="roadAsphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <!-- Headlight Beam -->
    <linearGradient id="beamGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <!-- Metallic Handlebar -->
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Glove Armor -->
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <!-- Speedo Dial Glow -->
    <radialGradient id="dialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 26 L456 88 L434 316 C424 398 352 456 256 488 C160 456 88 398 78 316 L56 88 Z" />
    </clipPath>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Crest Shadow & Frame -->
  <path d="M256 16 L468 82 L444 322 C433 410 358 470 256 502 C154 470 79 410 68 322 L44 82 Z" fill="#020617" />
  <path d="M256 22 L462 85 L439 319 C428 404 355 463 256 495 C157 463 84 404 73 319 L50 85 Z" fill="url(#shieldBorder)" />

  <!-- Clipped Scene Inside Shield -->
  <g clip-path="url(#shieldClip)">
    <!-- Background -->
    <rect x="44" y="20" width="424" height="476" fill="url(#shieldInner)" />
    <!-- Sunset Upper Sky -->
    <rect x="44" y="20" width="424" height="225" fill="url(#sunsetSky)" />
    <circle cx="256" cy="218" r="115" fill="url(#sunGlow)" />
    <!-- Setting Sun Core -->
    <circle cx="256" cy="228" r="46" fill="#fef08a" />
    <circle cx="256" cy="228" r="56" fill="none" stroke="#fde047" stroke-opacity="0.45" stroke-width="5" />

    <!-- Horizon Skyline Silhouette -->
    <path d="M50 236 L86 236 L86 206 L108 206 L108 236 L124 236 L124 192 L152 192 L152 236 L176 236 L176 214 L204 214 L204 236 L256 210 L308 236 L326 236 L326 204 L354 204 L354 236 L368 236 L368 188 L398 188 L398 236 L422 236 L422 212 L462 212 L462 246 L50 246 Z" fill="#090d16" />

    <!-- Ground Shoulders -->
    <polygon points="44,242 468,242 468,496 44,496" fill="#18120e" />

    <!-- 3-Lane Perspective Road -->
    <polygon points="222,242 290,242 468,496 44,496" fill="url(#roadAsphalt)" />
    <!-- Gold/Yellow Edge Curbs -->
    <polygon points="218,242 224,242 62,496 44,496" fill="#f59e0b" />
    <polygon points="288,242 294,242 468,496 450,496" fill="#f59e0b" />

    <!-- Center & Lane Perspective Dashes -->
    <polygon points="242,248 245,248 228,284 221,284" fill="#f8fafc" opacity="0.85" />
    <polygon points="236,304 241,304 214,358 202,358" fill="#f8fafc" opacity="0.92" />
    <polygon points="226,386 234,386 192,468 175,468" fill="#f8fafc" />

    <polygon points="267,248 270,248 291,284 284,284" fill="#f8fafc" opacity="0.85" />
    <polygon points="271,304 276,304 310,358 298,358" fill="#f8fafc" opacity="0.92" />
    <polygon points="278,386 286,386 337,468 320,468" fill="#f8fafc" />

    <!-- High-Speed Headlight Cones -->
    <polygon points="212,380 256,242 300,380" fill="url(#beamGrad)" />
    <polygon points="154,424 236,244 276,244 358,424" fill="url(#beamGrad)" opacity="0.5" />

    <!-- Motion Wind-Rush Lines -->
    <g stroke="#38bdf8" stroke-linecap="round" opacity="0.62">
      <line x1="94" y1="138" x2="132" y2="174" stroke-width="3" />
      <line x1="80" y1="184" x2="116" y2="210" stroke-width="2.5" />
      <line x1="418" y1="138" x2="380" y2="174" stroke-width="3" />
      <line x1="432" y1="184" x2="396" y2="210" stroke-width="2.5" />
    </g>

    <!-- Rear-View Mirrors (First-Person Cockpit) -->
    <!-- Left Mirror Stalk & Housing -->
    <path d="M188 370 L132 292" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <path d="M84 268 C84 256 96 250 112 250 L150 254 C162 255 168 264 166 278 C164 292 154 300 140 300 L102 296 C88 294 84 282 84 268 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
    <path d="M94 270 C94 263 102 258 112 258 L146 261 C154 262 158 268 157 277 C155 286 148 292 138 292 L104 289 C96 288 94 279 94 270 Z" fill="#ea580c" opacity="0.45" />

    <!-- Right Mirror Stalk & Housing -->
    <path d="M324 370 L380 292" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <path d="M428 268 C428 256 416 250 400 250 L362 254 C350 255 344 264 346 278 C348 292 358 300 372 300 L410 296 C424 294 428 282 428 268 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
    <path d="M418 270 C418 263 410 258 400 258 L366 261 C358 262 354 268 355 277 C357 286 364 292 374 292 L408 289 C416 288 418 279 418 270 Z" fill="#ea580c" opacity="0.45" />

    <!-- Sport Windscreen Visor -->
    <path d="M180 372 C194 304 222 276 256 276 C290 276 318 304 332 372 Z" fill="#0f172a" fill-opacity="0.58" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="3" />

    <!-- Handlebar Assembly -->
    <path d="M88 422 Q168 370 256 370 Q344 370 424 422 L416 444 Q338 394 256 394 Q174 394 96 444 Z" fill="url(#barMetal)" stroke="#020617" stroke-width="3" />

    <!-- Brake & Clutch Levers -->
    <path d="M158 386 L96 400 C88 402 86 410 94 412 L154 398 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />
    <path d="M354 386 L416 400 C424 402 426 410 418 412 L358 398 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />

    <!-- Left Rider Forearm & Armored Racing Glove Gripping Left Handlebar -->
    <path d="M58 486 L104 428 L142 442 L116 498 Z" fill="#00b862" stroke="#020617" stroke-width="3" />
    <path d="M98 412 C94 398 106 386 126 386 L154 388 C168 390 174 404 166 420 L150 448 C142 458 118 456 106 440 Z" fill="url(#gloveGrad)" stroke="#f59e0b" stroke-width="3" />
    <!-- Glove Knuckle Trim -->
    <rect x="114" y="394" width="36" height="10" rx="5" fill="#f59e0b" transform="rotate(-14 132 399)" />

    <!-- Right Rider Forearm & Armored Racing Glove Gripping Throttle -->
    <path d="M454 486 L408 428 L370 442 L396 498 Z" fill="#00b862" stroke="#020617" stroke-width="3" />
    <path d="M414 412 C418 398 406 386 386 386 L358 388 C344 390 338 404 346 420 L362 448 C370 458 394 456 406 440 Z" fill="url(#gloveGrad)" stroke="#f59e0b" stroke-width="3" />
    <rect x="362" y="394" width="36" height="10" rx="5" fill="#f59e0b" transform="rotate(14 380 399)" />

    <!-- Central Digital Motorcycle Speedometer Cluster -->
    <circle cx="256" cy="398" r="58" fill="#020617" stroke="#f59e0b" stroke-width="5" />
    <circle cx="256" cy="398" r="50" fill="url(#dialGlow)" stroke="#38bdf8" stroke-width="2" />
    <!-- Tachometer Arc -->
    <path d="M216 420 A46 46 0 1 1 296 420" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <path d="M216 420 A46 46 0 0 1 284 360" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
    <path d="M284 360 A46 46 0 0 1 301 402" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    <!-- Speed Needle -->
    <line x1="256" y1="398" x2="291" y2="375" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="398" r="6" fill="#fde047" />
    <!-- Speed Readout -->
    <text x="256" y="427" text-anchor="middle" fill="#f8fafc" font-family="Arial Black, Impact, sans-serif" font-size="22" font-weight="900">168</text>
    <text x="256" y="440" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5">KM/H</text>

    <!-- Bottom Cameroon Tricolor Racing Ribbon Inside Shield -->
    <rect x="60" y="468" width="132" height="24" fill="#00b862" />
    <rect x="192" y="468" width="128" height="24" fill="#e11d48" />
    <rect x="320" y="468" width="132" height="24" fill="#f59e0b" />
    <!-- Center Gold Star -->
    <polygon points="256,472 258.6,478 265,478.4 260,482.6 261.6,488.8 256,485.2 250.4,488.8 252,482.6 247,478.4 253.4,478" fill="#fef08a" />
  </g>

  <!-- Crisp Inner Gold Shield Rim -->
  <path d="M256 26 L456 88 L434 316 C424 398 352 456 256 488 C160 456 88 398 78 316 L56 88 Z" fill="none" stroke="#fef08a" stroke-opacity="0.55" stroke-width="3" />
</svg>
